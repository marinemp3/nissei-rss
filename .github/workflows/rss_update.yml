name: RSSフィード自動更新

permissions:
  contents: write
  actions: write  # keepalive アクションが GitHub API を利用するために必要

on:
  schedule:
    - cron: '0 7 * * *'  # 中国時間 15:00 = UTC 7:00
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # rebase を安全に行うため全履歴を取得
          fetch-depth: 0
      
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 依存関係をインストール
        run: pip install -r requirements.txt
      
      - name: RSSフィードを生成
        run: python create_rss.py
      
      - name: 変更をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git diff --staged --quiet || git commit -m "RSSフィードを自動更新 $(date '+%Y-%m-%d %H:%M:%S')"
          # プッシュ前にリモートの変更を取り込む（競合回避）
          git pull --rebase origin ${{ github.ref_name }}
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
